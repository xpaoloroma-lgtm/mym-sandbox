function tailMix(fo){
  var s = [0, 0, 0], any = false;
  for(var i = 2; i < 5; i++){ var f = fo[i]; if(!f) continue; any = true; for(var k = 0; k < 3; k++) s[k] += MIX[f][k] * (i + 1); }
  if(!any) return null;
  var t = s[0] + s[1] + s[2];
  return s.map(function(v){ return v / t * 100; });
}
function renderMix(){
  var box = $('mixbox'); if(!box) return;
  var past = S.rounds.slice(cycStart()); if(past.length < 2) past = S.rounds.slice(-10);
  var pts = past.map(function(rd){ return tailMix(rd.o.map(famOf)); }).filter(Boolean);
  var today = null;
  [0, 1].forEach(function(R){ if(R === 1 && S.skip2) return; var fo = shown()[R].map(famOf); if(fo.slice(2).every(Boolean)) today = tailMix(fo); });
  if(!pts.length && !today){ box.innerHTML = '<div class="mx-h">Cosa stai allenando</div><div class="mx-empty">Si legge dalla coda dei round (posizioni 3, 4 e 5): compare dal primo round fatto.</div>'; return; }
  var all = pts.concat(today ? [today] : []), n = Math.max(all.length, 2);
  var W = 100, H = 22;
  var cols = ['var(--mx-a)', 'var(--mx-i)', 'var(--mx-f)'];
  var rows = '';
  for(var k = 0; k < 3; k++){
    var xy = all.map(function(m, i){ return [(i / (n - 1)) * W, H - 2 - m[k] / 80 * (H - 4)]; });
    var solid = xy.slice(0, pts.length), last = xy[xy.length - 1];
    var dSolid = solid.length > 1 ? 'M' + solid.map(function(p){ return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' L') : '';
    var dToday = today && solid.length ? 'M' + solid[solid.length - 1].join(',') + ' L' + last.join(',') : '';
    var cur = Math.round((today || pts[pts.length - 1])[k]);
    rows += '<div class="mx-row" style="--c:' + cols[k] + '"><span class="mx-n">' + MIX_S[k] + '</span>' +
      '<svg viewBox="0 -2 ' + W + ' ' + (H + 4) + '" preserveAspectRatio="none" aria-hidden="true">' +
      (dSolid ? '<path d="' + dSolid + '" class="ln"/>' : '') + (dToday ? '<path d="' + dToday + '" class="ln td"/>' : '') +
      '</svg><span class="mx-v' + (today ? ' live' : '') + '">' + cur + '%</span></div>';
  }
  box.innerHTML = '<div class="mx-h">Cosa stai allenando</div>' + rows;
}
/* due frasi al massimo: com'è la coda nel ciclo, e cosa cambia oggi */
function mixSay(pts, today){
  var out = [];
  if(pts.length){
    var avg = [0, 1, 2].map(function(k){ return pts.reduce(function(a, m){ return a + m[k]; }, 0) / pts.length; });
    var top = avg.indexOf(Math.max.apply(null, avg));
    var same = pts.filter(function(m){ return m.indexOf(Math.max.apply(null, m)) === top; }).length;
    var word = ['aerobica', 'di intensità', 'di forza'][top];
    out.push('La tua chiusura è soprattutto ' + word + ' (' + Math.round(avg[top]) + '%)' + (same / pts.length >= 0.7 ? ': ci torni quasi sempre, è una scelta.' : ', ma cambia spesso: stai ancora provando.'));
    if(today){
      var diff = [0, 1, 2].map(function(k){ return today[k] - avg[k]; });
      var bi = 0; diff.forEach(function(v, i){ if(Math.abs(v) > Math.abs(diff[bi])) bi = i; });
      if(Math.abs(diff[bi]) >= 8) out.push('Oggi sposti ' + (diff[bi] > 0 ? 'verso ' : 'via da ') + ['l\'aerobico', 'l\'intensità', 'la forza'][bi] + ' (' + (diff[bi] > 0 ? '+' : '') + Math.round(diff[bi]) + ').');
      else out.push('Oggi resti sulla tua strada.');
    }
  } else if(today){
    var tb = today.indexOf(Math.max.apply(null, today));
    out.push('Oggi la coda è soprattutto ' + ['aerobica', 'di intensità', 'di forza'][tb] + ' (' + Math.round(today[tb]) + '%).');
  }
  return out.join(' ');
}

/* Righello: il primo sta in cima, il fondo è lo 0%. Gli altri stanno alla loro distanza dal primo, in proporzione.
   Se due sono troppo vicini, si scostano solo quanto basta per leggere il nome. */
/* Avanzamento del ciclo: numero + una linea sottile, come il righello. Pieno = registrato, tenue = messo oggi. */
function progHtml(doneN, nowN, tot){
  return '<div class="vp-num"><b>' + nowN + '</b><span>/ ' + tot + ' round</span></div>' +
         '<div class="vp-bar"><i class="now" style="width:' + (nowN / tot * 100) + '%"></i><i class="done" style="width:' + (doneN / tot * 100) + '%"></i></div>';
}
function placeRank(box, st, pct){
  var W = box.clientWidth, H = box.clientHeight; if(!W || !H) return;
  var horiz = W > H * 1.6;
  box.classList.toggle('horiz', horiz);
  if(!box.querySelector('.tick')){
    var t = ''; for(var k = 0; k <= 10; k++) t += '<i class="tick' + (k % 5 === 0 ? ' half' : '') + '" data-k="' + k + '"></i>';
    box.insertAdjacentHTML('afterbegin', t);
  }
  box.querySelectorAll('.tick').forEach(function(t){
    var k = +t.dataset.k;
    if(horiz){ t.style.top = ''; t.style.left = (k * 10) + '%'; } else { t.style.left = ''; t.style.top = (k * 10) + '%'; }
  });
  var PADR = horiz ? 16 : 0;   /* margine a destra: il primo non tocca il bordo */
  var L = (horiz ? W : H) - PADR;
  /* SCALA FISSA: in cima la media 1 (sempre primo), in fondo la media 5 (sempre ultimo).
     Così una famiglia si muove solo se cambia la SUA media: chi non viene toccato resta fermo. */
  var top = 100, span = 100;
  var rows = st.map(function(x){
    var el = box.querySelector('.pr[data-id="' + x.fam + '"]');
    var hh = horiz ? el.offsetWidth : el.offsetHeight;
    return {el:el, h:hh, y:(top - pct(x)) / span * (L - hh)};
  });
  var GAP = horiz ? 14 : 8, GAPL = 26;   /* GAPL: lo spazio dove passa la linea del cambio */
  function sopra(i){ return rows[i].el.classList.contains('lead'); }
  /* da qui in giù: le famiglie che non possono più arrivare al cambio, qualunque cosa succeda nei round che mancano */
  var salvi = rows.length; while(salvi > 0 && rows[salvi - 1].el.classList.contains('out')) salvi--;
  rows.forEach(function(r, i){ r.el.classList.toggle('salvo', i >= salvi); });
  function taglio(i){ return (sopra(i) && !sopra(i + 1)) || (i + 1 === salvi); }   /* tra la riga i e la i+1 passa una linea */
  if(st.every(function(x){ return x.avg == null; })){   /* nessun round ancora: in fila, senza distanze */
    var y0 = 0; rows.forEach(function(r){ r.y = y0; y0 += r.h + GAP * 2; });
    rows.forEach(function(r){ if(horiz){ r.el.style.left = Math.round(W - r.y - r.h) + 'px'; r.el.style.top = ''; } else { r.el.style.top = Math.round(r.y) + 'px'; r.el.style.left = ''; } });
    return;
  }
  for(var i = 0; i < rows.length; i++){
    rows[i].y = Math.max(rows[i].y, 0);
    if(i) rows[i].y = Math.max(rows[i].y, rows[i - 1].y + rows[i - 1].h + (taglio(i - 1) ? GAPL : GAP));
  }
  for(var j = rows.length - 1; j >= 0; j--){
    var lim = j === rows.length - 1 ? L - rows[j].h : rows[j + 1].y - rows[j].h - (taglio(j) ? GAPL : GAP);
    rows[j].y = Math.min(rows[j].y, lim);
  }
  rows.forEach(function(r){
    if(horiz){ r.el.style.left = Math.round(W - PADR - r.y - r.h) + 'px'; r.el.style.top = ''; }   /* in orizzontale: chi va al cambio sta a destra */
    else { r.el.style.top = Math.round(r.y) + 'px'; r.el.style.left = ''; }
  });
  var oldZone = box.querySelector('.rk-zone'); if(oldZone) oldZone.remove();
  /* LA LINEA DEL CAMBIO: chi sta sopra (a destra, quando è in orizzontale) va al cambio. Se sono pari, sono sopra in più d'uno. */
  var ln = box.querySelector('.rk-linea'), ult = -1;
  rows.forEach(function(r, i){ if(sopra(i)) ult = i; });
  if(ult === -1 || ult === rows.length - 1){ if(ln) ln.remove(); }
  else {
    if(!ln){ ln = document.createElement('div'); ln.className = 'rk-linea'; ln.innerHTML = '<span></span>'; box.appendChild(ln); }
    /* se sotto la linea del cambio sono già tutti "non cambia più" e sopra ce n'è una sola: il cambio è sicuro */
    var sicuro = salvi === ult + 1 && ult === 0;
    ln.firstChild.textContent = (sicuro ? 'cambio sicuro · round ' : 'cambio · round ') + (box.dataset.giro || '');
    ln.classList.toggle('sicuro', sicuro);
    var q = rows[ult].y + rows[ult].h + GAPL / 2;
    if(horiz){ ln.style.top = ''; ln.style.left = Math.round(W - PADR - q) + 'px'; } else { ln.style.left = ''; ln.style.top = Math.round(q) + 'px'; }
  }
  /* LA LINEA DI CHI NON CAMBIA PIÙ: sale dal basso. Chi sta sotto (a sinistra, in orizzontale) può andare in qualunque posto, tanto non arriva al cambio. */
  var ls = box.querySelector('.rk-salvi');
  if(salvi <= 0 || salvi >= rows.length){ if(ls) ls.remove(); return; }
  if(!ls){ ls = document.createElement('div'); ls.className = 'rk-salvi'; ls.innerHTML = '<span>non cambia più</span>'; box.appendChild(ls); }
  ls.classList.toggle('unita', salvi === ult + 1);   /* le due linee sono arrivate nello stesso punto: ne resta una, quella del cambio */
  var q2 = salvi === ult + 1 ? rows[ult].y + rows[ult].h + GAPL / 2 : rows[salvi].y - GAPL / 2;
  if(horiz){ ls.style.top = ''; ls.style.left = Math.round(W - PADR - q2) + 'px'; } else { ls.style.left = ''; ls.style.top = Math.round(q2) + 'px'; }
}
/* Tendenza: la media della famiglia adesso contro com'era prima dell'ultima seduta. ▲ sale verso il cambio, ▼ scende verso l'adattamento.
   Sotto 0,25 di posizione non segno niente (scelta). */
function avgUpTo(fk, n){
  var sw = 0, sp = 0; S.rounds.slice(cycStart(), cycStart() + n).forEach(function(rd, j){ var p = famIdx(rd.o, fk); if(p === -1) return; sw += 1; sp += (p + 1); });
  return sw ? sp / sw : null;
}
function trendOf(fk){
  var n = cycLen(), last = S.sessions.length ? S.sessions[S.sessions.length - 1] : null;
  if(!last || n < 3) return 0;
  var before = Math.max(0, last.at - cycStart());
  var a0 = avgUpTo(fk, before), a1 = avgUpTo(fk, n);
  if(a0 == null || a1 == null) return 0;
  return a0 - a1 > 0.25 ? 1 : a1 - a0 > 0.25 ? -1 : 0;
}
/* Rivedi il ciclo: la classifica rifà il percorso round per round, poi torna a oggi. */
var REPLAY = null;
function replayCycle(){
  if(REPLAY){ clearTimeout(REPLAY); REPLAY = null; renderSide(); return; }
  var n = cycLen(); if(n < 2){ toast('Servono almeno 2 round contati nel ciclo'); return; }
  var box = $('rank'), j = 1, btn = $('replay');
  var pct = function(x){ return x.avg == null ? 0 : Math.round((5 - x.avg) / 4 * 100); };
  btn.classList.add('on');
  (function step(){
    var stj = FAMS.map(function(f){ return {fam:f.k, id:S.prop[f.k], avg:avgUpTo(f.k, j)}; })
      .sort(function(a, b){ return a.avg - b.avg || FAM[a.fam].label.localeCompare(FAM[b.fam].label); });
    stj.forEach(function(x, i){ var row = box.querySelector('.pr[data-id="' + x.fam + '"]'); if(row) row.classList.toggle('lead', i === 0); });
    placeRank(box, stj, pct);
    var rd = S.rounds[cycStart() + j - 1];

var drag = null, suppressClick = false;
/* ═══ REGOLA: lo stesso esercizio non apre due round di fila ═══
   La catena dei round è: … ultimo round dell'allenamento precedente → Round 1 di oggi → Round 2 di oggi.
   Chi ha aperto un round non può aprire il successivo. */
function lastFirstFam(){ var n = S.rounds.length; return n ? famOf(S.rounds[n - 1].o[0]) : null; }
function forbiddenFams(R, rounds){
  return R === 0 ? [lastFirstFam(), S.skip2 ? null : famOf(rounds[1][0])] : [famOf(rounds[0][0])];
}
function breaksRule(rounds){
  for(var R = 0; R < 2; R++){
    if(R === 1 && S.skip2) continue;
    var f = famOf(rounds[R][0]);
    if(f != null && forbiddenFams(R, rounds).indexOf(f) !== -1) return {r:R, id:rounds[R][0]};
  }
  return null;
}
function checkRule(res){
  if(!res || !res.ok) return res;
  var b = breaksRule(res.rounds);
  if(b && !breaksRule(S.today)) return {ok:false, why:'first', id:b.id};
  return res;
}
function applyMove(src, tgt){ return checkRule(applyMove0(src, tgt)); }
function applyMove0(src, tgt){
  if(src.kind === 'block' && (!tgt || tgt.r !== src.r)) tgt = {kind:'disp', r:src.r};
  var rs = S.today.map(function(r){ return r.slice(); });
  var cp = JSON.parse(JSON.stringify(S.copies));
  if(!tgt) return null;
  var id = src.id;
  if(tgt.kind === 'disp'){
    if(src.kind !== 'block' || tgt.r !== src.r) return null;
    rs[src.r][src.i] = null;
    return {ok:true, rounds:rs, copies:syncCopies(rs, cp), back:{id:id, r:src.r}};
  }
  var R = tgt.r, j = tgt.i;
  if(src.r !== R) return null;
  if(src.kind === 'tile'){
    if(rs[R].indexOf(id) !== -1) return rs[R][j] === id ? null : {ok:false};
    rs[R][j] = id;
    return {ok:true, rounds:rs, copies:syncCopies(rs, cp)};
  }
  if(src.r === R){
    if(src.i === j) return null;
    var tmp = rs[R][j]; rs[R][j] = id; rs[R][src.i] = tmp;
    return {ok:true, rounds:rs, copies:syncCopies(rs, cp)};
  }
  if(rs[R].indexOf(id) !== -1) return {ok:false};
  var t = copyIn(id, src.r, cp);
  rs[R][j] = id; rs[src.r][src.i] = null; if(t !== -1) cp[id][t] = R;
  return {ok:true, rounds:rs, copies:syncCopies(rs, cp)};
}
function targetAt(x, y){
  /* il bersaglio si calcola dalla posizione, non dall'elemento sotto il mouse:
     così aggancia anche sopra note, ×, linee e grafico */

  var disp = el.closest('.rdisp');
  if(disp) return {kind:'disp', el:disp, r:+disp.dataset.r};

  var r = +body.closest('.round').dataset.r, rc = body.getBoundingClientRect();
  var br = body.querySelector('.blocks').getBoundingClientRect(); if(x > br.right) return null;
  var u = (y - rc.top) / rc.height * 15, cum = 0, i = 0;
  for(i = 0; i < 5; i++){ cum += HB[i]; if(u < cum) break; }
  i = Math.max(0, Math.min(4, i));

}

/* Gruppi di movimento. Upper: tirata/spinta vengono dal database. Le altre famiglie: raggruppate per parola chiave
   del nome (squat, affondi, plank…). Questo raggruppamento è una scelta mia, da rivedere. */
var MOV_RULES = {
  L:[[/squat|wall sit/i,'Squat'],[/lunge|split|step/i,'Affondi e step'],[/hip/i,'Anca'],[/.*/,'Altri']],
  C:[[/plank|body saw/i,'Plank'],[/rollout|jack knife/i,'Rollout e jack knife'],[/carry|walk/i,'Trasporti'],[/twist|halo|lift|paloff|renegade/i,'Rotazione e anti-rotazione'],[/crunch|sit up|deadbug/i,'Flessione'],[/.*/,'Altri']],
  B:[[/burpee|up & down|ground to stand|frogger|bbj|reaper|inchworm|prone|bear/i,'A terra e ritorno'],[/swing|slam|thruster|ball shot|battlerope|jumping jack/i,'Balistici'],[/climber|bike|skierg|sled|row/i,'Macchine e spinte'],[/.*/,'Altri']],
  T:[[/run|walk/i,'Camminata e corsa'],[/.*/,'Macchine e step']]
};
function movOf(r){
  var cat = r[2];
  if(cat === 'row') return 'Tirata'; if(cat === 'push') return 'Spinta';
  var rules = MOV_RULES[DB[r[0]].fam] || [[/.*/,'Altri']];
  for(var i = 0; i < rules.length; i++) if(rules[i][0].test(r[1])) return rules[i][1];
  return 'Altri';
}

    .filter(function(r){ var n = r[1].toLowerCase(); return words.every(function(w){ return n.indexOf(w) !== -1; }); })
    .sort(function(a, b){ return a[1].localeCompare(b[1], 'it'); });
  function item(r){
    var cur = r[0] === pk.oldId, nm = esc(r[1]);
    if(words.length){ words.forEach(function(w){ nm = nm.replace(new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>'); }); }
    return '<button type="button" class="pitem' + (cur ? ' cur' : '') + (pk.sel === r[0] ? ' sel' : '') + '" data-pick="' + r[0] + '"' + (cur ? ' disabled' : '') + '><i style="background:' + f.css + '"></i><span>' + nm + '</span></button>';
  }

  if(!list.length) h = '<div class="pempty">Nessun esercizio con “' + esc(q) + '”.</div>';
  else if(PK_SORT === 'az') h = list.map(item).join('');
  else {

    list.forEach(function(r){ var g = movOf(r); if(!groups[g]){ groups[g] = []; order.push(g); } groups[g].push(r); });
    order.sort(function(a, b){ return a === 'Altri' ? 1 : b === 'Altri' ? -1 : a.localeCompare(b, 'it'); });
    order.forEach(function(g){ h += '<div class="pg">' + g + '<b>' + groups[g].length + '</b></div>' + groups[g].map(item).join(''); });

  var b = e.target.closest('[data-pick]'); if(!b || !pk) return;
  pk.sel = +b.dataset.pick;
  $('pk-list').querySelectorAll('.pitem').forEach(function(x){ x.classList.toggle('sel', x === b); });
  $('pk-ok').disabled = false;
  /* prima scelta: un clic basta, non serve anche Conferma. Nel cambio resta, perché lì c'è anche il motivo. */
  if(pk.mode === 'init') $('pk-ok').click();
});
$('pk-x').addEventListener('click', closePicker);
$('veil').addEventListener('pointerdown', function(e){ if(e.target === $('veil')) closePicker(); });
$('pk-ok').addEventListener('click', function(){
  if(!pk || pk.sel == null) return;
  var old = pk.oldId, nw = pk.sel, fk = pk.fam, fromR = pk.r;
  if(pk.mode === 'init'){
    S.prop[fk] = nw; toast(FAM[fk].label + ': ' + DB[nw].nome);
  } else if(pk.mode === 'replace' && phase() === 'straddle' && fromR === 1){
    /* il 10° round è il Round 1 di oggi: il nuovo entra nel Round 2, il cambio si scrive quando si registra */
    S.pend = {fam:fk, from:old, to:nw};
    S.today[1] = S.today[1].map(function(x){ return famOf(x) === fk ? null : x; });
    toast(DB[nw].nome + ' entra dal Round 2');
  } else if(pk.mode === 'replace'){
    S.events.push({type:'cambio', at:S.rounds.length, date:S.simDate, from:old, to:nw, pt:'Paolo'});
    S.prop[fk] = nw;
    S.today = S.today.map(function(r){ return r.map(function(x){ return famOf(x) === fk ? null : x; }); });
    toast(DB[old].nome + ' → ' + DB[nw].nome + ' · nuovo ciclo');
  } else {
    /* variazione libera: vale dal round in cui la fai; i round prima tengono l'esercizio fatto */
    S.events.push({type:'variation', at:S.rounds.length + fromR, date:S.simDate, from:old, to:nw, pt:'Paolo', why:$('pk-mot-in').value.trim()});
    S.prop[fk] = nw;
    /* il nuovo prende il posto del vecchio, nella stessa posizione */
    S.today = S.today.map(function(r, R){ return R < fromR ? r : r.map(function(x){ return famOf(x) === fk ? nw : x; }); });
    toast(DB[old].nome + ' → ' + DB[nw].nome);
  }
  S.copies = syncCopies(S.today, S.copies);
  save(); closePicker(); renderAll();
});

/* ═══ SESSIONE — come in Open ═══
   Aprendo il cliente, se oggi la sessione non è ancora confermata, compare lo splash:
   PT + "Conferma sessione" (la seduta si conta da subito) oppure "Solo consultazione" (si guarda, non si tocca).
   Non c'è un "fine seduta": l'ordine dei round resta della sessione finché non cambia il giorno.
   Alla prima apertura di un altro giorno la sessione precedente si chiude: contano i round completi, i round tornano vuoti. */
var PT_LIST = ['Ale','Fil','Flower','Ile','PR','Ste'];
var VIEW = false, splashPT = null, splashTimer = null;
function addDays(iso, n){ var t = new Date(iso + 'T12:00:00'); t.setDate(t.getDate() + n); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); }
function nextDay(iso){ var w = new Date(iso + 'T12:00:00').getDay(); return addDays(iso, w === 1 ? 3 : w === 4 ? 4 : 3); }   /* lunedì e giovedì, per la demo */
function closeSession(){
  if(!S.sess) return null;
  if(!S.conf) S.conf = [null, null];
  var date = S.sess.date, pt = S.sess.pt, ph = phase(), at = S.rounds.length, n = 0;
  var full = function(r){ return !!S.conf[r] && S.today[r].every(function(x){ return x != null; }); };   /* fatto = pieno E confermato */
  if(full(0)){ S.rounds.push({date:date, pt:pt, o:S.today[0].slice()}); n++; }
  if(!S.skip2 && full(1)){
    if(ph === 'straddle' && S.pend && n === 1){
      S.events.push({type:'cambio', at:S.rounds.length, date:date, from:S.pend.from, to:S.pend.to, pt:pt});
      S.prop[S.pend.fam] = S.pend.to;
    }
    S.rounds.push({date:date, pt:pt, o:S.today[1].slice()}); n++;
  }
  if(n) S.sessions.push({date:date, pt:pt, at:at, n:n});
  /* al cambio di giorno si svuota tutto: anche i round preparati e non confermati */
  S.today = [[null,null,null,null,null],[null,null,null,null,null]]; S.conf = [null, null];
  S.skip2 = false; S.pend = null; S.sess = null;
  S.copies = syncCopies(S.today, {});
  return {date:date, n:n};
}
function openDay(){
  VIEW = false; applyView();
  var closed = null, dropped = false;
  /* cambio di giorno: la sessione confermata si chiude e conta; quello fatto in sola consultazione non conta e si svuota */
  if(S.sess && S.sess.date !== S.simDate){ closed = closeSession(); save(); }
  else if(!S.sess && S.dayOf && S.dayOf !== S.simDate && S.today.some(function(r){ return r.some(function(x){ return x != null; }); })){
    /* giorno nuovo senza niente di confermato: i blocchi tornano vuoti */
    S.today = [[null,null,null,null,null],[null,null,null,null,null]]; S.conf = [null, null]; S.skip2 = false; S.pend = null; S.copies = syncCopies(S.today, {});
  }

  if(S.dayOf !== S.simDate){ S.dayOf = S.simDate; save(); }
  laneVals = [null, null]; renderAll();
  if(closed && closed.n) toast('Sessione del ' + formatDate(closed.date) + ' · ' + closed.n + ' round salvati');
  clearTimeout(splashTimer);
  if(!S.sess) splashTimer = setTimeout(splashOpen, closed ? 1400 : 700);   /* in Open: 5 secondi */
}
function splashOpen(){
  return;   /* in Self lo splash non serve più: la giornata conta quando si conferma un round, e il PT si sceglie lì */
  if(S.sess) return;
  splashPT = null; renderPtStrip();
  $('ss-date').textContent = formatDate(S.simDate);
  $('ss-ok').disabled = true;
  $('sess-splash').classList.add('open');
}
function splashClose(){ $('sess-splash').classList.remove('open'); }
function renderPtStrip(){
  $('ss-pt').innerHTML = PT_LIST.map(function(p){ return '<button type="button" class="ss-ptb' + (splashPT === p ? ' sel' : '') + '" data-pt="' + p + '">' + p + '</button>'; }).join('');
}
$('ss-pt').addEventListener('click', function(e){ var b = e.target.closest('[data-pt]'); if(!b) return; splashPT = b.dataset.pt; renderPtStrip(); $('ss-ok').disabled = false; });
var daConfermare = null;   /* il round che aspetta il PT per essere confermato */
/* chi sei: si chiede una volta sola, lì dove si conferma il primo round. Scegliere il nome conferma il round. */
function ptChiudi(){ var p = $('pt-pop'); if(p) p.remove(); daConfermare = null; }
function ptChiedi(r){
  ptChiudi(); daConfermare = r;
  var bt = document.querySelector('.rconf[data-conf="' + r + '"]'), q = bt.getBoundingClientRect();
  var p = document.createElement('div'); p.id = 'pt-pop';
  p.innerHTML = '<span>PT</span>' + PT_LIST.map(function(n){ return '<button type="button" data-ptc="' + n + '">' + n + '</button>'; }).join('');
  document.body.appendChild(p);
  var w = p.offsetWidth;
  p.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, q.right - w)) + 'px'; p.style.top = (q.bottom + 6) + 'px';
}
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-ptc]');
  if(b){ var r = daConfermare; S.sess = {date:S.simDate, pt:b.dataset.ptc}; ptChiudi(); save(); if(r != null) confermaRound(r); return; }
  if($('pt-pop') && !e.target.closest('#pt-pop') && !e.target.closest('.rconf')) ptChiudi();
});
function confermaRound(r){
  if(!S.today[r].every(function(x){ return x != null; })) return;
  if(!S.sess){ ptChiedi(r); return; }
  if(!S.conf) S.conf = [null, null];
  S.conf[r] = S.today[r].join(','); save(); renderAll(); toast('Round ' + (r + 1) + ' confermato');
}
$('ss-ok').addEventListener('click', function(){
  if(!splashPT) return;
  S.sess = {date:S.simDate, pt:splashPT};
  var r = daConfermare; daConfermare = null;
  splashClose(); VIEW = false; applyView(); save();
  if(r != null) confermaRound(r); else { renderAll(); toast('Sessione confermata · ' + splashPT); }
});
$('ss-view').addEventListener('click', function(){ daConfermare = null; splashClose(); VIEW = true; applyView(); });
document.addEventListener('click', function(e){ var b = e.target.closest('[data-conf]'); if(b) confermaRound(+b.dataset.conf); });
$('vo-confirm').addEventListener('click', splashOpen);
function applyView(){ document.body.classList.toggle('view-only', VIEW); }
if($('nextday')) $('nextday').addEventListener('click', function(){
  splashClose(); S.simDate = nextDay(S.simDate); save(); openDay();
});
if($('undo')) $('undo').addEventListener('click', undo);
if($('newcli')) $('newcli').addEventListener('click', function(){
  if(!confirm('Ricominciare da un cliente nuovo? I dati della demo in questo browser si perdono (Annulla li riporta).')) return;
  S = blank(); save(); openDay();
});
/* Demo on = la storia inventata di Mario Rossi (ottobre e novembre). Demo off = cliente vuoto, da zero. */
function demoAccesa(){ return S.demo != null ? !!S.demo : !!(S.rounds.length && S.rounds[0].date === '2026-10-13'); }
function demoMostra(){ var b = $('reset'); if(!b) return; var on = demoAccesa(); b.textContent = on ? 'Demo on' : 'Demo off'; b.classList.toggle('gold', on); b.classList.toggle('demo-off', !on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); b.title = on ? 'Stai vedendo la storia inventata di prova. Clic: cliente vuoto' : 'Stai vedendo un cliente vuoto. Clic: carica la storia inventata di prova'; }
if($('reset')) $('reset').addEventListener('click', function(){
  var on = demoAccesa();
  S = on ? blank() : seed(); S.demo = !on; save(); openDay(); demoMostra();
  toast(on ? 'Demo off · cliente vuoto' : 'Demo on · storia di prova');
});
document.addEventListener('keydown', function(e){
  if((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key.toLowerCase() === 'z' && !e.target.closest('input,textarea')){ e.preventDefault(); undo(); }
});

/* ═══ STORICO — stessa struttura di Open: riepilogo + timeline per mese, dal più recente ═══ */
function formatDate(iso){ var p = iso.split('-'); return p[2] + '/' + p[1] + '/' + p[0].slice(2); }
function formatMonth(iso){
  var months = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
  var p = iso.split('-'); return months[parseInt(p[1]) - 1] + ' ' + p[0];
}
/* Sessioni = round della stessa data. Gli eventi stanno al loro posto nella fila dei round (at = quanti round c'erano prima). */
function buildLog(){
  var log = [], ev = S.events.slice().sort(function(a, b){ return a.at - b.at; }), k = 0;
  function emit(upto){ while(k < ev.length && ev[k].at <= upto){ var e = ev[k++]; log.push({type:e.type, date:e.date, from:e.from, to:e.to, pt:e.pt, why:e.why}); } }
  S.sessions.forEach(function(s){
    emit(s.at);
    log.push({type:'session', date:s.date, pt:s.pt, n:s.n});
    emit(s.at + Math.max(0, s.n - 1));
  });
  if(S.sess) log.push({type:'session', date:S.sess.date, pt:S.sess.pt, live:true});
  emit(Infinity);
  return log;
}
function renderTimeline(){
  if($('tl-count')) $('tl-count').textContent = S.sessions.length + (S.sess ? 1 : 0) || '';
  var container = $('tl-content'), log = buildLog();
  if(!log.length){ container.innerHTML = '<div class="tl-empty">Nessuna sessione ancora.<br>La prima si conta dallo splash, quando apri il cliente.</div>'; return; }
  var sessions = log.filter(function(e){ return e.type === 'session'; }).length;
  var cambi = log.filter(function(e){ return e.type === 'cambio'; }).length;
  var startDateStr = (function(){ var p = log[0].date.split('-'); return +p[2] + '/' + (+p[1]) + '/' + p[0]; })();
  var statsHtml = '<div class="tl-stats">' +
    '<div class="tl-stat"><div class="tl-stat-label">Sessioni</div><div class="tl-stat-val">' + sessions + '</div></div>' +
    '<div class="tl-stat"><div class="tl-stat-label">Cambi</div><div class="tl-stat-val">' + cambi + '</div></div>' +
    '<div class="tl-stat"><div class="tl-stat-label">Variaz.</div><div class="tl-stat-val">' + log.filter(function(e){ return e.type === 'variation'; }).length + '</div></div>' +
    '<div class="tl-stat"><div class="tl-stat-label">Ciclo</div><div class="tl-stat-val">' + Math.min(cycLen(), CICLO) + '/' + CICLO + '</div></div>' +
    '<div class="tl-stat"><div class="tl-stat-label">Inizio</div><div class="tl-stat-val" style="font-size:13px">' + startDateStr + '</div></div>' +
    '<div class="tl-stat"><div class="tl-stat-label">PT</div><div class="tl-stat-val" style="font-size:13px;color:rgba(200,175,90,0.80)">' + esc((S.sess || S.sessions[S.sessions.length - 1] || {}).pt || '—') + '</div></div>' +
  '</div>';
  var months = {}, monthOrder = [];
  log.slice().reverse().forEach(function(entry){
    var mk = entry.date.slice(0, 7);
    if(!months[mk]){ months[mk] = []; monthOrder.push(mk); }
    months[mk].push(entry);
  });
  var trackHtml = '<div class="tl-track">';
  monthOrder.forEach(function(mk){
    trackHtml += '<div class="tl-month"><div class="tl-month-label">' + formatMonth(mk + '-01') + '</div>';
    months[mk].forEach(function(entry){
      if(entry.type === 'session'){
        trackHtml += '<div class="tl-entry e-session"><div class="tl-node"><div class="tl-dot"></div></div>' +
          '<div class="tl-body"><div class="tl-entry-date">' + formatDate(entry.date) + '</div><div class="tl-entry-label">Sessione' + (entry.live ? ' · in corso' : entry.n === 1 ? ' · 1 round' : entry.n === 0 ? ' · nessun round' : '') + '</div></div>' +
          '<div class="tl-pt">' + (entry.pt || '—') + '</div></div>';
      } else if(entry.type === 'variation'){
        trackHtml += '<div class="tl-entry e-var"><div class="tl-node"><div class="tl-dot"></div></div>' +
          '<div class="tl-body"><div class="tl-entry-date">' + formatDate(entry.date) + '</div><div class="tl-entry-label">Variazione &middot; ' + FAM[DB[entry.from].fam].label + '</div>' +
          '<div class="tl-swap var"><span class="was">' + esc(DB[entry.from].nome) + '</span><span class="now"><span class="tl-badge-dot"></span>' + esc(DB[entry.to].nome) + '</span></div>' +
          (entry.why ? '<div class="tl-why"><b>perché: </b>' + esc(entry.why) + '</div>' : '') + '</div>' +
          '<div class="tl-pt">' + (entry.pt || '—') + '</div></div>';
      } else {
        var f = FAM[DB[entry.from].fam];
        trackHtml += '<div class="tl-entry e-step"><div class="tl-node"><div class="tl-dot"></div></div>' +
          '<div class="tl-body"><div class="tl-entry-date">' + formatDate(entry.date) + '</div><div class="tl-entry-label">Cambio · fine ciclo</div>' +
          '<div class="tl-swap"><span class="was">' + esc(DB[entry.from].nome) + '</span><span class="now" style="color:' + (f.txt || f.hex) + '"><span class="tl-badge-dot"></span>' + esc(DB[entry.to].nome) + '</span></div></div>' +
          '<div class="tl-pt">' + (entry.pt || '—') + '</div></div>';
      }
    });
    trackHtml += '</div>';
  });
  container.innerHTML = statsHtml + trackHtml;
}

function setUnit(){ document.querySelectorAll('.rbody').forEach(function(b){ b.style.setProperty('--u', (b.clientHeight / 15) + 'px'); }); }
if(window.ResizeObserver) new ResizeObserver(setUnit).observe(document.querySelector('.rbody'));
window.addEventListener('resize', setUnit);
load(); setUnit(); openDay();
</script>
<script id="sbx-storico-js">
/* Lo storico a scomparsa segue il mouse con una regola sola, senza scatti:
   si apre quando il mouse arriva contro il bordo destro (anche sopra la
   barra di scorrimento, anche se esce dalla finestra da quella parte) e si
   richiude solo quando il mouse si allontana davvero verso sinistra. */
(function(){
  function monta(panel){
    var aperto = false, t = null;
    function apri(){ clearTimeout(t); t = null; if(!aperto){ aperto = true; panel.classList.add('sto-aperto'); } }
    function chiudi(){ if(t || !aperto) return; t = setTimeout(function(){ t = null; aperto = false; panel.classList.remove('sto-aperto'); }, 280); }
    function resta(){ clearTimeout(t); t = null; }
    document.addEventListener('mousemove', function(e){
      /* il riquadro dentro cui scorre: non sempre è il genitore diretto */
      var casa = (panel.offsetParent || panel.parentNode).getBoundingClientRect();
      if(!casa.width || !casa.height) return;                 /* protocollo non a schermo */
      var dentroInAltezza = e.clientY >= casa.top && e.clientY <= casa.bottom;
      if(!aperto){ if(dentroInAltezza && e.clientX >= casa.right - 18) apri(); return; }
      var bordoPannello = casa.right - panel.offsetWidth;
      if(dentroInAltezza && e.clientX >= bordoPannello - 30) resta(); else chiudi();
    }, true);   /* in cattura: lo sente anche se la pagina ferma l'evento */
    document.documentElement.addEventListener('mouseleave', function(e){
      /* uscire dalla finestra verso destra non lo chiude */
      if(aperto && e.clientX < window.innerWidth - 4) chiudi();
    });
  }
  function parti(){ [].forEach.call(document.querySelectorAll('#tl-panel'), monta); }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', parti); else parti();
})();
</script>
