<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><title>Move · seduta (prova)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* PROVA: la seduta di Move con il cliente. È una prima idea di disposizione, con dati di esempio scritti a mano:
   non legge i blocchi veri, non salva niente. Serve per decidere dove stanno le cose e quanto sono grandi. */
:root{--gold:#d4a84a;--gold-txt:#deba6e;--move:#78cd9b;--red:#e5484d;--line:rgba(180,195,210,.16);--txt:#ece6d6;--lo:rgba(190,204,218,.62);}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:#0d0c0a;color:var(--txt);font-family:"Exo 2","Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;}
header{flex:none;height:56px;display:flex;align-items:center;gap:10px;padding:0 24px;border-bottom:1px solid rgba(222,190,120,.22);font-size:12px;letter-spacing:3px;text-transform:uppercase;}
header .g{color:var(--gold-txt);} header .m{color:var(--move);} header .s{color:var(--lo);} header .d{margin-left:auto;color:var(--lo);letter-spacing:2px;}
main{flex:1;min-height:0;display:grid;grid-template-columns:232px minmax(0,1.12fr) minmax(0,1fr);gap:12px;padding:12px;}
.col{min-height:0;display:flex;flex-direction:column;gap:12px;}
.et{font-size:9px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--lo);}

/* ── I BLOCCHI ── Il blocco è LO STESSO dell'editor (move.html, ".bk"): riquadro con la barra a sinistra, il nome, e tre righe
   "1 · 2 · Cardio" con l'esercizio. Nella seduta è solo più grande; nell'elenco per sceglierlo è alla misura dell'editor.
   La barra è neutra: in Move il colore non ha ancora un significato. */
.blocchi{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(212,168,74,.4) transparent;}
.bk{border:1px solid var(--line);border-left:3px solid rgba(200,196,186,.55);border-radius:2px;padding:12px 14px;background:rgba(26,24,21,.5);}
.bk-n{display:flex;align-items:center;gap:8px;font-size:17px;color:var(--txt);letter-spacing:.5px;margin-bottom:6px;}
.bk-r{font-size:14px;color:var(--lo);line-height:1.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bk-r i{font-style:normal;display:inline-block;width:60px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(190,204,218,.45);}
/* nella seduta: lo stesso blocco, ingrandito, e alto quanto gli tocca */
.blocchi .bk{flex:1 1 0;min-height:150px;display:flex;flex-direction:column;justify-content:center;padding:14px 18px 16px;}
.blocchi .bk-n{font-size:24px;font-weight:300;margin-bottom:12px;}
.blocchi .bk-r{font-size:21px;color:rgb(250,246,236);line-height:1.75;}
.blocchi .bk-r i{width:84px;font-size:11px;letter-spacing:2px;}
.blocchi .bk.fatto{border-color:rgba(120,205,155,.5);border-left-color:rgba(120,205,155,.9);}
.blocchi .bk.fatto .bk-r{color:rgba(250,246,236,.55);}
.bk-n .ok{margin-left:auto;height:28px;padding:0 14px;border:1px solid rgba(212,168,74,.5);background:none;color:var(--gold-txt);font:600 10px "Exo 2",sans-serif;letter-spacing:2.5px;text-transform:uppercase;cursor:pointer;}
.bk.fatto .bk-n .ok{border-color:rgba(120,205,155,.45);color:var(--move);}
.bk-n .via{width:28px;height:28px;border:1px solid var(--line);background:none;color:var(--lo);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.bk-n .via:hover{border-color:rgba(212,168,74,.6);color:var(--gold-txt);}
.bk-n .via svg{width:12px;height:12px;display:block;}
/* ── LA COLONNA DEI BLOCCHI DA PRENDERE: gli stessi blocchi dell'editor, alla stessa misura. Si trascinano nella seduta (o un clic li mette in fondo). ── */
.lib{min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);background:#12110f;}
.lib-su{flex:none;display:flex;align-items:center;gap:8px;padding:12px 12px 10px;}
.lib-su .lbl{font-size:12px;font-weight:600;letter-spacing:3px;text-transform:uppercase;}
.lib-su a{margin-left:auto;height:28px;padding:0 10px;display:flex;align-items:center;border:1px solid var(--line);color:var(--lo);font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;text-decoration:none;}
.lib-su a:hover{border-color:rgba(212,168,74,.6);color:var(--gold-txt);}
.lib-cerca{flex:none;padding:0 12px;}
#bq{width:100%;height:36px;padding:0 12px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--txt);font:400 14px "Exo 2",sans-serif;outline:0;}
#bq:focus{border-color:rgba(212,168,74,.6);}
.filtri{flex:none;display:flex;flex-wrap:wrap;gap:5px;padding:8px 12px 10px;border-bottom:1px solid var(--line);}
.filtri button{height:28px;padding:0 9px;border:1px solid var(--line);background:none;color:var(--lo);font:600 9px "Exo 2",sans-serif;letter-spacing:1.6px;text-transform:uppercase;cursor:pointer;}
.filtri button.on{border-color:rgba(212,168,74,.75);color:var(--gold-txt);background:rgba(212,168,74,.08);}
.bl{flex:1;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin;scrollbar-color:rgba(212,168,74,.4) transparent;}
.bl .bk{flex:none;cursor:grab;} .bl .bk:hover{border-color:rgba(212,168,74,.6);} .bl .bk.gia{opacity:.45;} .bl .bk:active{cursor:grabbing;}
.bl .bk-n{font-size:15px;} .bl .bk-r{font-size:13px;} .bl .bk-r i{width:50px;font-size:9px;}
.bl .niente{font-size:13px;color:var(--lo);padding:6px 2px;}
/* la seduta mentre si trascina: il bordo si accende e una riga dorata dice dove cadrà il blocco */
.blocchi.sopra{outline:1px dashed rgba(212,168,74,.7);outline-offset:3px;}
.blocchi .qui{flex:none;height:0;border-top:2px solid var(--gold);margin:-6px 0;}
.blocchi .vuota{flex:1;display:flex;align-items:center;justify-content:center;border:1px dashed rgba(180,195,210,.28);color:var(--lo);font-size:10px;font-weight:600;letter-spacing:3px;text-transform:uppercase;}
.blocchi .bk{cursor:grab;} .blocchi .bk.preso{opacity:.35;}
.piu{flex:none;height:40px;border:1px dashed rgba(180,195,210,.28);background:none;color:var(--lo);font:600 10px "Exo 2",sans-serif;letter-spacing:3px;text-transform:uppercase;cursor:pointer;}

/* ── IL CLIENTE ── */
.chi{flex:none;border:1px solid var(--line);background:#12110f;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:baseline;}
.chi .nome{font-size:26px;font-weight:300;line-height:1.1;}
.chi .dati{grid-column:1 / -1;display:flex;gap:22px;margin-top:8px;}
.chi .dati div{display:flex;flex-direction:column;gap:3px;} .chi .dati b{font-size:16px;font-weight:400;}
/* ── LE RED FLAG ── Non è un'interfaccia nuova: sono le stesse schede con l'interruttore della finestra Red Flags (stile copiato da Load, che è quello di Open).
   Qui nella colonna c'è il SUNTO: solo quelle accese, ognuna con il suo interruttore. Tutto l'elenco, con i testi e le note, si apre da "Tutte". */
:root{--text-hi:#ece6d6;--text-lo:rgba(190,204,218,.62);--text-xlo:rgba(190,204,218,.45);--font:"Exo 2","Segoe UI",Arial,sans-serif;}
.rf{flex:none;border:1px solid rgba(220,100,100,.55);border-left:5px solid rgba(235,110,110,1);background:linear-gradient(90deg,rgba(220,100,100,.10),rgba(220,100,100,.03));padding:10px 12px 12px;}
.rf-su{display:flex;align-items:center;gap:10px;}
.rf-su .et{color:rgba(240,150,150,1);font-size:10px;letter-spacing:3.5px;}
.rf-su i{width:9px;height:9px;border-radius:50%;background:rgba(235,110,110,1);color:rgba(235,110,110,.6);animation:rfPulse 2.6s ease-out infinite;}
.rf.vuota{border-color:var(--line);border-left-color:rgba(180,195,210,.3);background:#12110f;} .rf.vuota .rf-su i{background:rgba(180,195,210,.3);animation:none;} .rf.vuota .rf-su .et{color:var(--lo);}
@keyframes rfPulse{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.rf-tutte{margin-left:auto;height:26px;padding:0 12px;border:1px solid rgba(220,100,100,.45);background:none;color:rgba(240,170,170,1);font:600 9.5px "Exo 2",sans-serif;letter-spacing:2.5px;text-transform:uppercase;cursor:pointer;}
.rf.vuota .rf-tutte{border-color:var(--line);color:var(--lo);}
.rf .rf-lista{margin-top:10px;}
.rf .rfc-t b{font-size:17px;} .rf .rfc-t em{font-size:13px;color:rgba(225,232,240,.8);} .rf .rfc-h{padding:9px 12px;} .rf .rfc-n{display:none;}
.rf .rfc-nt{display:block;font-size:13px;font-weight:500;color:rgb(246,236,210);margin-top:3px;}
.rf-lista{margin-top:16px;display:flex;flex-direction:column;gap:6px}
.rfc{border-radius:5px;border:1px solid rgba(180,195,210,.12);border-left:3px solid rgba(180,195,210,.18);background:rgba(180,195,210,.02)}
.rfc.on{border-color:color-mix(in srgb,var(--c) 45%,transparent);border-left-color:var(--c);background:color-mix(in srgb,var(--c) 8%,transparent)}
.rfc-h{display:flex;align-items:center;gap:12px;padding:10px 12px;cursor:pointer}
.rfc-n{font-size:12px;font-weight:600;color:var(--text-xlo);width:18px}
.rfc-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rfc-t b{font-size:14px;font-weight:600;color:rgba(225,232,240,.92)}
.rfc.on .rfc-t b{color:var(--c)}
.rfc-t em{font-style:normal;font-size:12px;font-weight:300;color:var(--text-lo)}
.rfc-sw{width:38px;height:20px;border-radius:10px;border:1px solid rgba(180,195,210,.3);background:rgba(180,195,210,.06);
  position:relative;cursor:pointer;flex-shrink:0;padding:0}
.rfc-sw i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:rgba(200,214,228,.55);transition:left .15s}
.rfc.on .rfc-sw{border-color:var(--c);background:color-mix(in srgb,var(--c) 30%,transparent)}
.rfc.on .rfc-sw i{left:20px;background:var(--c)}
.rfc-b{display:none;padding:0 14px 14px 42px;flex-direction:column;gap:10px}
.rfc.ap .rfc-b{display:flex}
.rfc-d{font-size:12.5px;font-weight:300;line-height:1.55;color:rgba(210,222,232,.88)}
.rfc-d span{display:block;font-size:9.5px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--text-xlo);margin-bottom:2px}
.rfc-d.fai span{color:var(--c)}
.rfc-nota,.rfc-in{width:100%;box-sizing:border-box;border-radius:4px;border:1px solid rgba(180,195,210,.18);background:rgba(255,255,255,.03);
  color:var(--text-hi);font-family:var(--font);font-size:13px;padding:8px 10px;resize:vertical}
.rfc-nota{min-height:56px}
.rfc-nota:focus,.rfc-in:focus{outline:0;border-color:rgba(212,168,74,.6)}


/* le due finestre: tutte le red flag, e la scelta del blocco */
.velo{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;background:rgba(4,4,3,.72);backdrop-filter:blur(3px);}
.velo.open{display:flex;}
.fin{width:680px;max-width:calc(100vw - 32px);max-height:calc(100vh - 40px);display:flex;flex-direction:column;background:#16140f;border:1px solid rgba(222,190,120,.3);}
.fin-su{flex:none;display:flex;align-items:center;gap:12px;padding:16px 20px 12px;}
.fin-su b{font-size:20px;font-weight:300;letter-spacing:.5px;}
.fin-x{margin-left:auto;height:30px;padding:0 14px;border:1px solid var(--line);background:none;color:var(--txt);font:600 10px "Exo 2",sans-serif;letter-spacing:2.5px;text-transform:uppercase;cursor:pointer;}
.fin-x:hover{border-color:rgba(212,168,74,.6);color:var(--gold-txt);}
.fin-b{flex:1;min-height:0;overflow-y:auto;padding:0 20px 20px;scrollbar-width:thin;scrollbar-color:rgba(212,168,74,.4) transparent;}
.fin-b .rf-lista{margin-top:0;}
/* ── LA SCELTA DEL BLOCCO: ricerca, filtri, elenco. Un clic sul blocco lo mette nella seduta di oggi. ── */
/* ── LE NOTE: campo grande, carattere grosso, quattro comandi ── */
.note{flex:1;min-height:150px;display:flex;flex-direction:column;border:1px solid var(--line);background:#12110f;}
.note:focus-within{border-color:rgba(212,168,74,.55);}
.barra{flex:none;display:flex;align-items:center;gap:4px;padding:7px 10px;border-bottom:1px solid var(--line);}
.barra .et{margin-right:auto;}
.barra button{height:30px;min-width:32px;padding:0 8px;border:1px solid transparent;background:none;color:var(--txt);font:500 14px "Exo 2",sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;}
.barra button:hover{border-color:rgba(212,168,74,.5);color:var(--gold-txt);}
.barra .u{text-decoration:underline;text-underline-offset:3px;}
.barra .col i{width:14px;height:14px;border-radius:50%;display:block;}
.barra .sep{width:1px;height:18px;background:var(--line);margin:0 4px;}
.carta{flex:1;min-height:0;overflow:auto;padding:12px 16px 16px;font-size:18px;font-weight:400;line-height:1.5;color:rgb(246,236,210);outline:0;scrollbar-width:thin;scrollbar-color:rgba(212,168,74,.4) transparent;}
.carta ul,.carta ol{margin:4px 0;padding-left:26px;} .carta li{margin:2px 0;}
.carta:empty::before{content:'Note';color:rgba(190,204,218,.3);}

@media (max-width:880px){ main{grid-template-columns:206px minmax(0,1.1fr) minmax(0,1fr);gap:10px;padding:10px;} .blocchi .bk-r{font-size:17px;} .blocchi .bk-n{font-size:20px;} .blocchi .bk-r i{width:62px;} .cella .nm{font-size:17px;} .rf li{font-size:17px;} .chi .nome{font-size:22px;} .carta{font-size:17px;} .b-su .nome{font-size:14px;} }
</style></head><body>
<header><span class="g">Sandbox</span><span class="s">›</span><span class="m">Move</span><span class="s">›</span><span>Cliente di esempio</span><span class="d">gio 26 nov</span></header>
<main>
  <div class="lib">
    <div class="lib-su"><span class="lbl">Blocchi <span id="bl-n" style="color:var(--lo)"></span></span><a href="move.html" title="L'editor dove si costruiscono i blocchi">Editor →</a></div>
    <div class="lib-cerca"><input id="bq" type="text" placeholder="Cerca blocco o esercizio" autocomplete="off"></div>
    <div class="filtri" id="filtri"></div>
    <div class="bl" id="bl"></div>
  </div>
  <div class="col">
    <div class="blocchi" id="blocchi"></div>
  </div>
  <div class="col">
    <div class="chi">
      <div class="nome">Cliente di esempio</div><span class="et">seduta 14</span>
      <div class="dati"><div><span class="et">Dal</span><b>set 2026</b></div><div><span class="et">Ultima</span><b>lun 23 nov</b></div><div><span class="et">PT</span><b>PR</b></div></div>
    </div>
    <div class="rf" id="rf"></div>
    <div class="note">
      <div class="barra">
        <span class="et">Note</span>
        <button type="button" data-c="insertUnorderedList" title="Elenco puntato">• —</button>
        <button type="button" data-c="insertOrderedList" title="Elenco numerato">1. —</button>
        <button type="button" data-c="underline" class="u" title="Sottolineato">S</button>
        <span class="sep"></span>
        <button type="button" class="col" data-col="rgb(246,236,210)" title="Colore normale"><i style="background:rgb(246,236,210)"></i></button>
        <button type="button" class="col" data-col="#deba6e" title="Dorato"><i style="background:#deba6e"></i></button>
        <button type="button" class="col" data-col="#78cd9b" title="Verde"><i style="background:#78cd9b"></i></button>
        <button type="button" class="col" data-col="#ff8a80" title="Rosso"><i style="background:#ff8a80"></i></button>
      </div>
      <div class="carta" id="carta" contenteditable="true" spellcheck="false"><div>Arriva sempre con la figlia, che aspetta fuori.</div><ul><li>cammina meglio <u>dopo</u> il primo blocco</li><li>la sedia alta, non quella bassa</li></ul><div><font color="#deba6e">Chiedere del controllo del 3 dicembre.</font></div></div>
    </div>
  </div>
</main>
<div class="velo" id="velo-rf"><div class="fin" role="dialog" aria-modal="true"><div class="fin-su"><b>Red Flags</b><button class="fin-x" type="button" data-chiudi>Chiudi</button></div><div class="fin-b"><div class="rf-lista" id="rf-lista"></div></div></div></div>
<script>
/* dati di esempio: tre blocchi, ognuno con Esercizio 1, Esercizio 2 e Cardio, come nell'editor */
var BLOCCHI = [
  {id:'x1', nome:'In piedi alla sbarra', fatto:true,  e:['Sit to stand','Alzate sui talloni'], cardio:'Marcia sul posto'},
  {id:'x2', nome:'Seduto',               fatto:false, e:['Estensione ginocchio','Tirate con elastico'], cardio:'Pedaliera'},
  {id:'x3', nome:'A terra',              fatto:false, e:['Ponte','Quadrupedia, braccio avanti'], cardio:'Camminata'}
];
function righe(b){ return '<div class="bk-r"><i>1</i>' + (b.e[0] || '—') + '</div><div class="bk-r"><i>2</i>' + (b.e[1] || '—') + '</div><div class="bk-r"><i>Cardio</i>' + (b.cardio || '—') + '</div>'; }
function disegna(){
  document.getElementById('blocchi').innerHTML = BLOCCHI.map(function(b, i){
    return '<div class="bk' + (b.fatto ? ' fatto' : '') + '" data-i="' + i + '" draggable="true"><div class="bk-n"><span>' + (b.nome || 'Senza nome') + '</span><button class="ok" type="button" data-i="' + i + '">' + (b.fatto ? '✓ fatto' : 'Fatto') + '</button>'
      + '<button class="via" type="button" data-via="' + i + '" title="Togli il blocco" aria-label="Togli il blocco"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button></div>' + righe(b) + '</div>';
  }).join('') || '<div class="vuota">Trascina qui i blocchi</div>';
}
disegna();
/* ═══ RED FLAGS ═══ Stesso elenco e stessi testi di Open e Load (RF_DATA copiato da Load). Stato per cliente: attivo + nota, più la Custom.
   Nella prova lo stato è in memoria con un esempio; nella pagina vera è state.redFlags del cliente aperto. */
var RF_DATA = [
  {id:'beta-bloccanti', num:'01', name:'Beta-bloccanti', slug:'Limitano l\'accelerazione cardiaca',
   color:'rgba(200,120,120,0.85)',
   shortDo:'programma a sensazione, FC inaffidabile',
   trigger:'Il cliente prende farmaci per la pressione o per il cuore (atenololo, bisoprololo, metoprololo, propranololo).',
   whyMatters:'Questi farmaci mettono un tetto alla frequenza cardiaca. Tutte le zone FC che usi per programmare diventano inaffidabili: se programmi sulla FC rischi di farlo lavorare troppo pensando che stia facendo poco.',
   whatYouDo:'Programmi interamente a sensazione e Talk Test. Ignori la frequenza cardiaca come strumento di programmazione.',
   patterns:'Qualsiasi formato basato su zone FC o soglie cardiache'},
  {id:'statine', num:'02', name:'Statine', slug:'Sensibilizzano il muscolo al danno',
   color:'rgba(220,180,80,0.85)',
   shortDo:'volume dimezzato i primi 30 giorni, no formati competitivi',
   trigger:'Il cliente prende farmaci per il colesterolo (atorvastatina, simvastatina, rosuvastatina) ed è sedentario.',
   whyMatters:'In una persona decondizionata che fa movimenti nuovi e intensi, il rischio di danno muscolare serio (rabdomiolisi) è quasi triplo. Dolore sproporzionato 24-72h dopo, urine scure.',
   whatYouDo:'Primo mese a metà volume. Zero formati competitivi. Progressione massima 10%/sett. Segnali rossi: dolore che non passa in 3 giorni, urine color tè scuro → medico subito.',
   patterns:'AMRAP / For Time nelle prime 4-8 settimane, alto volume eccentrico'},
  {id:'diabete', num:'03', name:'Diabete', slug:'Glicemia instabile sotto sforzo',
   color:'rgba(200,160,100,0.85)',
   shortDo:'glucometro pre/post, niente glicolitico se <90 mg/dL',
   trigger:'Il cliente prende insulina, metformina, sulfaniluree o altri farmaci per la glicemia.',
   whyMatters:'I circuiti glicolitici bruciano zucchero velocemente. Combinati col farmaco possono far crollare la glicemia durante o dopo la sessione. Sintomi senza preavviso: tremori, confusione, sudore freddo.',
   whatYouDo:'Glucometro pre/post. Qualcosa di zuccherato a portata di mano. No circuiti glicolitici intensi se la glicemia pre-sessione è sotto 90 mg/dL.',
   patterns:'Circuiti glicolitici senza monitoraggio, sessioni lunghe senza possibilità di fermarsi'},
  {id:'ipertensione', num:'04', name:'Ipertensione', slug:'Picchi pressori sotto sforzo',
   color:'rgba(200,100,100,0.85)',
   shortDo:'no Valsalva, no cedimento, no isometrie prolungate',
   trigger:'Il cliente ha la pressione alta, anche se controllata con farmaci.',
   whyMatters:'Anche con farmaci, certi movimenti creano picchi enormi di pressione arteriosa. Sled push o cedimento → Valsalva → pressione pericolosa.',
   whatYouDo:'Eviti il cedimento muscolare completo. Istruzioni precise sulla respirazione. Se arriva strano (mal di testa, ronzio, vertigini) non lo fai allenare.',
   patterns:'Sled push massimale, carry pesanti a cedimento, isometriche prolungate sotto fatica'},
  {id:'osteoporosi', num:'05', name:'Osteoporosi', slug:'Fragilità ossea agli impatti',
   color:'rgba(180,195,210,0.88)',
   shortDo:'no impatti, no flessione spinale sotto carico',
   trigger:'Diagnosi di osteoporosi (T-score ≤ -2.5) o uso prolungato di cortisone.',
   whyMatters:'Le ossa non reggono le forze d\'impatto. La flessione spinale sotto carico può causare fratture vertebrali. Attenzione: osteopenia è diversa, lì l\'impatto controllato è benefico.',
   whatYouDo:'Elimini impatto e flessione spinale sotto carico. Il resistance training è raccomandato. Post-menopausa o fratture recenti senza densitometria → medico prima.',
   patterns:'Box jump, burpees, plyometria, atterraggi, flessione spinale sotto carico'},
  {id:'asma', num:'06', name:'Asma da sforzo', slug:'Broncocostrizione post-esercizio',
   color:'rgba(120,180,220,0.85)',
   shortDo:'warm-up 10-15 min, inalatore a portata di mano',
   trigger:'Fiato corto o sibili durante/dopo sforzo intenso. Colpisce il 10-50% della popolazione — molti non lo sanno.',
   whyMatters:'La ventilazione alta secca i bronchi che si restringono. Il sibilo arriva 5-10 minuti dopo lo sforzo, non durante. Il cliente sembra ok nel circuito e si trova in difficoltà nel cooldown.',
   whatYouDo:'Warm-up progressivo 10-15 min: terapeutico, crea il periodo refrattario. Se ha un inalatore deve averlo a portata di mano, non nello zaino.',
   patterns:'Partenza a freddo con circuiti intensi, sessioni in ambienti freddi e secchi'},
  {id:'post-malattia', num:'07', name:'Post-malattia', slug:'Rischio cardiologico nelle settimane al rientro',
   color:'rgba(200,150,80,0.85)',
   shortDo:'min 7 gg senza sintomi, no HIIT 2 settimane',
   trigger:'Cliente stato male di recente — influenza, COVID, febbre, qualsiasi infezione virale.',
   whyMatters:'Non la malattia in sé ma l\'infiammazione che può lasciare al cuore (miocardite). Si sente guarito, ma il cuore potrebbe essere ancora infiammato. HIIT in quella finestra è veramente rischioso.',
   whatYouDo:'Minimo 7 giorni completamente senza sintomi. Al rientro: niente formati competitivi per almeno 2 settimane. Se durante la malattia ha avuto dolore al petto, palpitazioni o vertigini → ok medico prima.',
   patterns:'Ritorno immediato a HIIT dopo malattia, formati competitivi nella prima settimana di rientro'}
];
var RF = { ipertensione:{attivo:true, note:'ramipril 5 mg'}, osteoporosi:{attivo:true, note:''}, __custom:{attivo:true, nome:'Protesi anca destra', cosaFare:'niente flessione oltre 90°'} };
function rfScheda(f, breve){
  var st = RF[f.id] || {}, on = !!st.attivo, ap = !!st.aperta && !breve;
  return '<div class="rfc' + (on ? ' on' : '') + (ap ? ' ap' : '') + '" style="--c:' + f.color + '">'
    + '<div class="rfc-h" data-rfx="' + f.id + '"><span class="rfc-n">' + f.num + '</span>'
    + '<span class="rfc-t"><b>' + f.name + '</b><em>' + (breve ? f.shortDo : f.slug) + '</em>' + (breve && st.note ? '<span class="rfc-nt">' + String(st.note).replace(/</g, '&lt;') + '</span>' : '') + '</span>'
    + '<button class="rfc-sw" data-rfo="' + f.id + '" aria-label="' + (on ? 'Spegni ' : 'Accendi ') + f.name + '"><i></i></button></div>'
    + (breve ? '' : '<div class="rfc-b">'
      + '<div class="rfc-d"><span>Come lo riconosci</span>' + f.trigger + '</div>'
      + '<div class="rfc-d"><span>Perché ti riguarda</span>' + f.whyMatters + '</div>'
      + '<div class="rfc-d fai"><span>Cosa fai</span>' + f.whatYouDo + '</div>'
      + '<div class="rfc-d"><span>Pattern a rischio</span>' + f.patterns + '</div>'
      + '<textarea class="rfc-nota" data-rfn="' + f.id + '" placeholder="Note specifiche del cliente (es. atenololo 50mg, diagnosi 2023)">' + (st.note || '').replace(/</g, '&lt;') + '</textarea></div>')
    + '</div>';
}
function rfCustom(breve){
  var c = RF.__custom || {}, ap = !!c.aperta && !breve;
  return '<div class="rfc custom' + (c.attivo ? ' on' : '') + (ap ? ' ap' : '') + '" style="--c:rgba(190,170,140,0.85)">'
    + '<div class="rfc-h" data-rfx="__custom"><span class="rfc-n">+</span>'
    + '<span class="rfc-t"><b>' + (breve ? (c.nome || 'Custom').replace(/</g, '&lt;') : 'Custom') + '</b><em>' + (breve ? (c.cosaFare || '').replace(/</g, '&lt;') : 'condizione non standard, definita dal PT') + '</em></span>'
    + '<button class="rfc-sw" data-rfo="__custom" aria-label="Custom"><i></i></button></div>'
    + (breve ? '' : '<div class="rfc-b"><input class="rfc-in" data-rfc="nome" placeholder="Nome (es. Ernia discale L4-L5)" value="' + (c.nome || '').replace(/"/g, '&quot;') + '">'
      + '<textarea class="rfc-nota" data-rfc="cosaFare" placeholder="Cosa fai: cosa modifichi nel programma">' + (c.cosaFare || '').replace(/</g, '&lt;') + '</textarea></div>')
    + '</div>';
}
/* il sunto nella colonna: solo quelle accese */
function rfSunto(){
  var acc = RF_DATA.filter(function(f){ return RF[f.id] && RF[f.id].attivo; }), cu = RF.__custom && RF.__custom.attivo, n = acc.length + (cu ? 1 : 0), el = document.getElementById('rf');
  el.classList.toggle('vuota', !n);
  el.innerHTML = '<div class="rf-su"><i></i><span class="et">Red Flags' + (n ? ' · ' + n : '') + '</span><button class="rf-tutte" type="button" data-rftutte>Tutte</button></div>'
    + (n ? '<div class="rf-lista">' + acc.map(function(f){ return rfScheda(f, true); }).join('') + (cu ? rfCustom(true) : '') + '</div>' : '');
}
function rfLista(){ document.getElementById('rf-lista').innerHTML = RF_DATA.map(function(f){ return rfScheda(f, false); }).join('') + rfCustom(false); }
function rfTocca(e, dentroFinestra){
  /* GLI INTERRUTTORI QUI NON SI MUOVONO. La regola della Sandbox è: per ACCENDERE un red flag serve la password di accesso,
     per TOGLIERLO serve la password admin (rfChiedi). Questa pagina di prova non ha né accesso né password, quindi non accende e non toglie niente:
     mostra soltanto. Nella pagina vera l'interruttore chiamerà rfChiedi, come nella finestra del cliente. */
  var o = e.target.closest('[data-rfo]');
  if(o){ avviso(o, RF[o.dataset.rfo] && RF[o.dataset.rfo].attivo ? 'Per toglierlo serve la password admin, dalla Sandbox' : 'Per accenderlo serve la password di accesso, dalla Sandbox'); return true; }
  var x = e.target.closest('[data-rfx]');
  if(x && dentroFinestra){ var k2 = x.dataset.rfx; RF[k2] = RF[k2] || {}; RF[k2].aperta = !RF[k2].aperta; rfLista(); return true; }
  if(x && !dentroFinestra){ var k3 = x.dataset.rfx; RF[k3] = RF[k3] || {}; RF[k3].aperta = true; apri('velo-rf'); rfLista(); return true; }   /* dal sunto: clic sul nome apre la finestra su quella */
  return false;
}
document.getElementById('rf').addEventListener('click', function(e){ if(e.target.closest('[data-rftutte]')){ rfLista(); apri('velo-rf'); return; } rfTocca(e, false); });
document.getElementById('velo-rf').addEventListener('click', function(e){ rfTocca(e, true); });
document.getElementById('velo-rf').addEventListener('input', function(e){
  var n = e.target.dataset.rfn, c = e.target.dataset.rfc;
  if(n){ RF[n] = RF[n] || {}; RF[n].note = e.target.value; }
  if(c){ RF.__custom = RF.__custom || {}; RF.__custom[c] = e.target.value; }   /* scrivere il nome non accende la Custom: per accendere serve la password */
  rfSunto();
});
var avvisoT = 0;
function avviso(vicino, testo){
  var a = document.getElementById('avviso'); if(!a){ a = document.createElement('div'); a.id = 'avviso'; a.style.cssText = 'position:fixed;z-index:400;max-width:260px;padding:9px 12px;background:#1b1813;border:1px solid rgba(220,100,100,.6);color:#f3e9e6;font-size:13px;line-height:1.35;pointer-events:none;transition:opacity .2s'; document.body.appendChild(a); }
  var r = vicino.getBoundingClientRect(); a.textContent = testo; a.style.opacity = 1; a.style.left = Math.max(8, Math.min(window.innerWidth - 276, r.right - 260)) + 'px'; a.style.top = (r.bottom + 8) + 'px';
  clearTimeout(avvisoT); avvisoT = setTimeout(function(){ a.style.opacity = 0; }, 2600);
}
function apri(id){ document.getElementById(id).classList.add('open'); }
function chiudi(){ [].forEach.call(document.querySelectorAll('.velo.open'), function(v){ v.classList.remove('open'); }); }
document.addEventListener('click', function(e){ if(e.target.closest('[data-chiudi]') || (e.target.classList && e.target.classList.contains('velo'))) chiudi(); });
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') chiudi(); });
rfSunto();

/* ═══ LA SCELTA DEL BLOCCO ═══
   L'elenco è quello dei blocchi salvati con l'editor di Move (stesso posto nel browser: 'move-blocchi', fatti così: {id, nome, e:[es1, es2], cardio}).
   Se nell'editor non ce n'è ancora nessuno, la prova mostra blocchi di esempio.
   I FILTRI sono da decidere: qui ci sono le posizioni dell'editor, e funzionano solo sui blocchi di esempio (quelli veri non hanno ancora una posizione). */
var ESEMPI = [
  {id:'x1', nome:'In piedi alla sbarra', e:['Sit to stand','Alzate sui talloni'], cardio:'Marcia sul posto', pos:'In piedi'},
  {id:'x2', nome:'Seduto', e:['Estensione ginocchio','Tirate con elastico'], cardio:'Pedaliera', pos:'Seduto'},
  {id:'x3', nome:'A terra', e:['Ponte','Quadrupedia, braccio avanti'], cardio:'Camminata', pos:'Quadrupedia'},
  {id:'x4', nome:'Equilibrio', e:['Tandem alla sbarra','Appoggio su un piede'], cardio:'Step basso', pos:'In piedi'},
  {id:'x5', nome:'Spalle da seduto', e:['Alzate laterali','Spinte sopra la testa'], cardio:'Pedaliera braccia', pos:'Seduto'},
  {id:'x6', nome:'Supino', e:['Ponte a una gamba','Dead bug'], cardio:'Camminata', pos:'Prono/Sup.'},
  {id:'x7', nome:'Camminata con ostacoli', e:['Passo laterale','Scavalco'], cardio:'Corridoio', pos:'In piedi'}
];
var LIB = []; try{ LIB = JSON.parse(localStorage.getItem('move-blocchi') || '[]') || []; }catch(e){ LIB = []; }
var VERI = LIB.length > 0; if(!VERI) LIB = ESEMPI;
if(VERI){ BLOCCHI.length = 0; disegna(); }   /* con i blocchi veri dell'editor la seduta parte vuota: i tre di esempio servono solo se l'editor è vuoto */
var VOCI = ['Tutti','In piedi','Seduto','Prono/Sup.','Quadrupedia'], filtro = 'Tutti';
function blElenco(){
  var q = document.getElementById('bq').value.trim().toLowerCase(), par = q.split(/\s+/).filter(Boolean);
  document.getElementById('filtri').innerHTML = VOCI.map(function(v){ return '<button type="button" class="' + (v === filtro ? 'on' : '') + '" data-f="' + v + '">' + v + '</button>'; }).join('');
  var l = LIB.filter(function(b){ var t = (b.nome + ' ' + (b.e || []).join(' ') + ' ' + (b.cardio || '')).toLowerCase(); return par.every(function(w){ return t.indexOf(w) !== -1; }) && (filtro === 'Tutti' || b.pos === filtro); });
  document.getElementById('bl-n').textContent = '· ' + LIB.length;
  document.getElementById('bl').innerHTML = l.length ? l.map(function(b){
    var gia = BLOCCHI.some(function(x){ return x.id === b.id; });
    return '<div class="bk' + (gia ? ' gia' : '') + '" data-b="' + b.id + '" draggable="true" title="Trascinalo nella seduta"><div class="bk-n"><span>' + (b.nome || 'Senza nome') + '</span></div>' + righe(b) + '</div>';
  }).join('') : '<div class="niente">Nessun blocco.</div>';
}
document.getElementById('bq').addEventListener('input', blElenco);
document.getElementById('filtri').addEventListener('click', function(e){ var f = e.target.closest('[data-f]'); if(f){ filtro = f.dataset.f; blElenco(); } });
function daLib(id){ var x = LIB.filter(function(q){ return q.id === id; })[0]; return x ? {id:x.id, nome:x.nome || 'Senza nome', fatto:false, e:(x.e || []).slice(), cardio:x.cardio || ''} : null; }
/* un clic sul blocco lo mette in fondo alla seduta (per chi non trascina) */
document.getElementById('bl').addEventListener('click', function(e){ var b = e.target.closest('[data-b]'); if(!b) return; var n = daLib(b.dataset.b); if(n){ BLOCCHI.push(n); disegna(); blElenco(); } });

/* ═══ TRASCINARE ═══ Dall'elenco alla seduta (il blocco entra dove lo lasci), e dentro la seduta per cambiare l'ordine. */
var presa = null;   /* {da:'lib', id} oppure {da:'sed', i} */
document.addEventListener('dragstart', function(e){
  var k = e.target.closest && e.target.closest('.bk'); if(!k) return;
  if(k.parentNode.id === 'bl') presa = {da:'lib', id:k.dataset.b};
  else if(k.parentNode.id === 'blocchi'){ presa = {da:'sed', i:+k.dataset.i}; k.classList.add('preso'); }
  else return;
  e.dataTransfer.effectAllowed = 'copyMove'; try{ e.dataTransfer.setData('text/plain', 'blocco'); }catch(x){}
});
function dove(y){   /* in che posto della seduta cade: prima del primo blocco che ha il centro sotto il mouse */
  var ks = [].slice.call(document.querySelectorAll('#blocchi > .bk')), i = ks.length;
  for(var q = 0; q < ks.length; q++){ var r = ks[q].getBoundingClientRect(); if(y < r.top + r.height / 2){ i = q; break; } }
  return i;
}
var zona = document.getElementById('blocchi');
zona.addEventListener('dragover', function(e){
  if(!presa) return; e.preventDefault(); e.dataTransfer.dropEffect = presa.da === 'lib' ? 'copy' : 'move';
  zona.classList.add('sopra');
  var i = dove(e.clientY), m = zona.querySelector('.qui'); if(!m){ m = document.createElement('div'); m.className = 'qui'; }
  var ks = zona.querySelectorAll(':scope > .bk'); if(ks[i]) zona.insertBefore(m, ks[i]); else zona.appendChild(m);
});
function pulisci(){ zona.classList.remove('sopra'); var m = zona.querySelector('.qui'); if(m) m.remove(); [].forEach.call(document.querySelectorAll('.bk.preso'), function(k){ k.classList.remove('preso'); }); }
zona.addEventListener('dragleave', function(e){ if(!zona.contains(e.relatedTarget)) pulisci(); });
zona.addEventListener('drop', function(e){
  if(!presa) return; e.preventDefault();
  var i = dove(e.clientY);
  if(presa.da === 'lib'){ var n = daLib(presa.id); if(n) BLOCCHI.splice(i, 0, n); }
  else { var x = BLOCCHI.splice(presa.i, 1)[0]; if(presa.i < i) i--; BLOCCHI.splice(i, 0, x); }
  presa = null; pulisci(); disegna(); blElenco();
});
document.addEventListener('dragend', function(){ presa = null; pulisci(); });
blElenco();
document.getElementById('blocchi').addEventListener('click', function(e){ var v = e.target.closest('.via'); if(v){ BLOCCHI.splice(+v.dataset.via, 1); disegna(); blElenco(); return; } var b = e.target.closest('.ok'); if(!b) return; var x = BLOCCHI[+b.dataset.i]; x.fatto = !x.fatto; disegna(); });
/* i quattro comandi delle note: elenco puntato, elenco numerato, sottolineato, colore */
document.querySelector('.barra').addEventListener('mousedown', function(e){
  var b = e.target.closest('button'); if(!b) return; e.preventDefault();   /* non togliere il cursore dal testo */
  document.getElementById('carta').focus();
  if(b.dataset.c) document.execCommand(b.dataset.c, false, null);
  else if(b.dataset.col) document.execCommand('foreColor', false, b.dataset.col);
});
</script>
